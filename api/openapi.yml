openapi: "3.0.3"

info:
  title: "holos: アクセス権限API"
  version: ""

servers:
  - url: "http://localhost:8003"
    description: "localhost"
  - url: "http://storage-api:8000"
    description: "docker compose service"

paths:
  /health:
    get:
      summary: "ヘルスチェック"
      tags:
        - "health"
      responses:
        204:
          $ref: "#/components/responses/no_content"
  /policies:
    post:
      summary: "ポリシー作成"
      tags:
        - "policies"
      security:
        - sessionAuth: []
        - accessKeyAuth: []
      parameters:
        - in: "header"
          name: "Authorization"
          schema:
            type: "string"
          required: true
          description: "セッショントークンまたはアクセスキー"
          example: "Session 1Ty1HKTPKTt8xEi-_3HTbWf2SCHOdqOS"
      requestBody:
        $ref: "#/components/requestBodies/create_policy"
      responses:
        201:
          $ref: "#/components/responses/create_policy"
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthenticated"
        403:
          $ref: "#/components/responses/unauthorized"
        422:
          $ref: "#/components/responses/invalid_input"
        500:
          $ref: "#/components/responses/internal_server_error"
    get:
      summary: "ポリシー一覧取得"
      tags:
        - "policies"
      security:
        - sessionAuth: []
        - accessKeyAuth: []
      parameters:
        - in: "header"
          name: "Authorization"
          schema:
            type: "string"
          required: true
          description: "セッショントークンまたはアクセスキー"
          example: "Session 1Ty1HKTPKTt8xEi-_3HTbWf2SCHOdqOS"
      responses:
        200:
          $ref: "#/components/responses/get_policies"
        401:
          $ref: "#/components/responses/unauthenticated"
        403:
          $ref: "#/components/responses/unauthorized"
        500:
          $ref: "#/components/responses/internal_server_error"
  /policies/{id}:
    put:
      summary: "ポリシー更新"
      tags:
        - "policies"
      security:
        - sessionAuth: []
        - accessKeyAuth: []
      parameters:
        - in: "header"
          name: "Authorization"
          schema:
            type: "string"
          required: true
          description: "セッショントークンまたはアクセスキー"
          example: "Session 1Ty1HKTPKTt8xEi-_3HTbWf2SCHOdqOS"
        - in: "path"
          name: "id"
          schema:
            type: "string"
            format: "uuid"
          required: true
          description: "ポリシーID"
          example: "e3e36f5d-0ec0-4ac4-a6b5-97f49212a376"
      requestBody:
        $ref: "#/components/requestBodies/update_policy"
      responses:
        200:
          $ref: "#/components/responses/update_policy"
        400:
          $ref: "#/components/responses/bad_request"
        401:
          $ref: "#/components/responses/unauthenticated"
        403:
          $ref: "#/components/responses/unauthorized"
        404:
          $ref: "#/components/responses/not_found"
        422:
          $ref: "#/components/responses/invalid_input"
        500:
          $ref: "#/components/responses/internal_server_error"
    delete:
      summary: "ポリシー削除"
      tags:
        - "policies"
      security:
        - sessionAuth: []
        - accessKeyAuth: []
      parameters:
        - in: "header"
          name: "Authorization"
          schema:
            type: "string"
          required: true
          description: "セッショントークンまたはアクセスキー"
          example: "Session 1Ty1HKTPKTt8xEi-_3HTbWf2SCHOdqOS"
        - in: "path"
          name: "id"
          schema:
            type: "string"
            format: "uuid"
          required: true
          description: "ポリシーID"
          example: "e3e36f5d-0ec0-4ac4-a6b5-97f49212a376"
      responses:
        204:
          $ref: "#/components/responses/no_content"
        401:
          $ref: "#/components/responses/unauthenticated"
        403:
          $ref: "#/components/responses/unauthorized"
        404:
          $ref: "#/components/responses/not_found"
        500:
          $ref: "#/components/responses/internal_server_error"
    get:
      summary: "ポリシー取得"
      tags:
        - "policies"
      security:
        - sessionAuth: []
        - accessKeyAuth: []
      parameters:
        - in: "header"
          name: "Authorization"
          schema:
            type: "string"
          required: true
          description: "セッショントークンまたはアクセスキー"
          example: "Session 1Ty1HKTPKTt8xEi-_3HTbWf2SCHOdqOS"
        - in: "path"
          name: "id"
          schema:
            type: "string"
            format: "uuid"
          required: true
          description: "ポリシーID"
          example: "e3e36f5d-0ec0-4ac4-a6b5-97f49212a376"
      responses:
        200:
          $ref: "#/components/responses/get_policy"
        401:
          $ref: "#/components/responses/unauthenticated"
        403:
          $ref: "#/components/responses/unauthorized"
        404:
          $ref: "#/components/responses/not_found"
        500:
          $ref: "#/components/responses/internal_server_error"

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: Session
    accessKeyAuth:
      type: http
      scheme: AccessKey

  schemas:
    created_at:
      type: "string"
      description: "作成日時"
      format: "date-time"
      example: "2017-07-21T17:32:28Z"
      readOnly: true
    updated_at:
      type: "string"
      description: "更新日時"
      format: "date-time"
      example: "2017-07-21T17:32:28Z"
      readOnly: true
    rule:
      type: "object"
      properties:
        service:
          type: "string"
          description: "サービス名"
          example: "service_name"
        actions:
          type: "array"
          items:
            type: "string"
            description: "アクション"
            example: "action"
        resources:
          type: "array"
          items:
            type: "string"
            description: "リソース"
            example: "e3e36f5d-0ec0-4ac4-a6b5-97f49212a376"
      required:
        - "service"
        - "actions"
    policy:
      type: "object"
      properties:
        id:
          type: "string"
          description: "ポリシーID"
          format: "uuid"
          example: "e3e36f5d-0ec0-4ac4-a6b5-97f49212a376"
          readOnly: true
        name:
          type: "string"
          description: "ポリシー名"
          example: "policy_name"
        rules:
          type: "array"
          items:
            $ref: "#/components/schemas/rule"
        created_at:
          $ref: "#/components/schemas/created_at"
        updated_at:
          $ref: "#/components/schemas/updated_at"
      required:
        - "id"
        - "name"
        - "rules"
        - "created_at"
        - "updated_at"

  requestBodies:
    create_policy:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/policy"
    update_policy:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/policy"

  responses:
    create_policy:
      description: "Success"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/policy"
    update_policy:
      description: "Success"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/policy"
    get_policy:
      description: "Success"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/policy"
    get_policies:
      description: "Success"
      content:
        application/json:
          schema:
            type: "object"
            properties:
              policies:
                type: "array"
                items:
                  $ref: "#/components/schemas/policy"
    no_content:
      description: "Success"
    bad_request:
      description: "Bad Request"
      content:
        text/plain:
          schema:
            type: "object"
            properties:
              error:
                type: "object"
                properties:
                  code:
                    type: "string"
                    example: "BAD_REQUEST"
                  message:
                    type: "string"
                    example: "bad request"
    unauthenticated:
      description: "Unauthenticated"
      content:
        text/plain:
          schema:
            type: "object"
            properties:
              error:
                type: "object"
                properties:
                  code:
                    type: "string"
                    example: "UNAUTHENTICATED"
                  message:
                    type: "string"
                    example: "unauthenticated"
    unauthorized:
      description: "Unauthorized"
      content:
        text/plain:
          schema:
            type: "object"
            properties:
              error:
                type: "object"
                properties:
                  code:
                    type: "string"
                    example: "UNAUTHORIZED"
                  message:
                    type: "string"
                    example: "unauthorized"
    not_found:
      description: "Not Found"
      content:
        text/plain:
          schema:
            type: "object"
            properties:
              error:
                type: "object"
                properties:
                  code:
                    type: "string"
                    example: "NOT_FOUND"
                  message:
                    type: "string"
                    example: "not found"
    invalid_input:
      description: "Invalid Input"
      content:
        text/plain:
          schema:
            type: "object"
            properties:
              error:
                type: "object"
                properties:
                  code:
                    type: "string"
                    example: "INVALID_INPUT"
                  message:
                    type: "string"
                    example: "invalid input"
    internal_server_error:
      description: "Internal Server Error"
      content:
        text/plain:
          schema:
            type: "object"
            properties:
              error:
                type: "object"
                properties:
                  code:
                    type: "string"
                    example: "INTERNAL_SERVER_ERROR"
                  message:
                    type: "string"
                    example: "internal server error"
